name: CI

# Runs on every push to main and on pull requests. A green check means the
# riskiest logic (IQR, year alignment, breakdown, CVM scale, PDF) still works.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax check (py_compile)
        run: python -m py_compile app.py data/*.py reports/*.py calculations/*.py tests/*.py

      - name: Run tests
        run: pytest -q
